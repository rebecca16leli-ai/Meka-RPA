# =============================================================================
# SELETORES DO ALMAH — ARQUIVO CENTRAL (Módulo 8 / Configurações)
#
# Regra de ouro: quando o Almah mudar de layout, ajuste AQUI, não no código.
# Cada seletor pode ter uma cadeia de fallback (lista) — o adapter tenta na ordem.
#
# Legenda dos campos:
#   selectors: lista de seletores tentados em ordem (CSS ou role=...).
#   status: ok        -> confirmado por inspeção
#           inferido  -> deduzido do padrão do Select2/Bootstrap, CONFIRMAR
#           TODO      -> ainda não coletado, BLOQUEIA o uso do passo
#   nota: observação técnica.
# =============================================================================

condominio:
  botao_trocar:
    selectors:
      - "#btn-condominio"
      - 'a[data-original-title="Trocar Condomínio"]'
    status: ok
    nota: "Confirmado por inspeção em 04/06/2026: <a id='btn-condominio'> contém o ícone i.him-icon.fa.fa-building. O alvo de clique é o <a>, não o <i>."

  select_nativo:
    selectors:
      - "#f_condominio"
    status: inferido
    nota: "Deduzido de 'select2-f_condominio-container'. CONFIRMAR que existe <select id='f_condominio'>."

  select2_container:
    selectors:
      - "#select2-f_condominio-container"
      - "span.select2-selection--single"
    status: ok
    nota: "Container do Select2 (padrão Bootstrap). Confirmado por inspeção em 04/06/2026."

  select2_search_input:
    selectors:
      - "input.select2-search__field"
      - ".select2-dropdown input[type='search']"
    status: ok
    nota: "Confirmado por inspeção em 04/06/2026: input.select2-search__field, font-size 13px."

  select2_opcao_resultado:
    selectors:
      - "li.select2-results__option"
      - ".select2-results__option"
    status: ok
    nota: "Confirmado por inspeção em 04/06/2026: lista filtra ao digitar; uma opção por <li>. Selecionar pela correspondência EXATA de texto."

  botao_confirmar:
    selectors:
      - "div.modal-toolbar button.btn-success"
      - "button.btn.btn-success"
    status: ok
    nota: "CORRIGIDO por inspeção em 04/06/2026: o botão verde é button.btn.btn-success (50x50, dentro de div.modal-toolbar > div.btn-group). NÃO usa title='Confirmar'."

  nome_ativo:
    selectors:
      - "a.hi-nome-cond"
      - "ul.hi-nomes li a.hi-nome-cond"
    status: ok
    nota: ">>> CRÍTICO <<< Nome do CONDOMÍNIO ativo no topo. Confirmado 05/06/2026: a.hi-nome-cond. CUIDADO: a.hi-nome-est é a ADMINISTRADORA (Guerreiro), não o condomínio."

menu:
  financeiro:
    selectors:
      - "ul.main-menu a.dropdown-toggle.modulo:has-text('Financeiro')"
      - "a.dropdown-toggle.modulo:has-text('Financeiro')"
    status: ok
    nota: "Confirmado por inspeção em 04/06/2026: a.dropdown-toggle.modulo dentro de ul.nav-list.main-menu. Casar por texto 'Financeiro' para não pegar outro módulo."

  contas_a_pagar:
    selectors:
      - "ul.submenu a.menu-item.btn-navigate:has-text('Contas a Pagar')"
      - "a.menu-item.btn-navigate:has-text('Contas a Pagar')"
    status: ok
    nota: "Confirmado por inspeção em 04/06/2026: a.menu-item.btn-navigate dentro de ul.submenu. URL ganha ?funcao=FIN00601 (usar como verificação extra de tela)."

recorrencia:
  # Fluxo: digitar o fornecedor no campo de busca da barra -> a tabela filtra ->
  # achar a LINHA da competência certa (pelo vencimento) -> DUPLO-CLIQUE para abrir.
  campo_busca:
    selectors:
      - "#f_datatable_filter"
      - "div.input-group-filter input.form-control"
    status: ok
    nota: "Confirmado 04/06/2026: input#f_datatable_filter (DataTables). Digitar o fornecedor aqui filtra a tabela."
  linha_tabela:
    selectors:
      - "table.dataTable tbody tr"
    status: ok
    nota: ">>> CRÍTICO <<< Tabela é DataTables. Cada linha é um <tr> do <tbody>. Abrir por DUPLO-CLIQUE na linha cujo Vencimento casa com a competência esperada. Mesmo fornecedor tem várias competências (ex.: 05/05 e 05/06)."
  coluna_vencimento:
    selectors:
      - "td"
    status: inferido
    nota: "Célula Vencimento lida por posição de coluna dentro do <tr> (ordem: Anexo, Cob.Recebida, Condomínio, Doc, Vencimento...). Confirmar índice no teste."

formulario:
  # Tela "Contas a Pagar > Alteração" (modal aberto pelo duplo-clique na recorrência).
  documento_referencia:
    selectors:
      - "#f_documento"
    status: ok
    nota: "Confirmado 04/06/2026: input#f_documento (texto da referência, ex.: 'REF. 05/2026' ou '282/675'). ALTERAR a cada mês para a competência correta."
  documento_tipo:
    selectors:
      - "TODO_DOCUMENTO_TIPO"
    status: TODO
    nota: "Dropdown do tipo (NOTA FISCAL/FATURA/BOLETO). Provável Select2. Em geral NÃO muda. Coletar se necessário."
  fornecedor:
    selectors:
      - "#f_fornecedor"
    status: inferido
    nota: "NÃO ALTERAR (já vem da recorrência). id inferido pelo padrão f_*. Apenas leitura/validação."
  descricao:
    selectors:
      - "#f_descricao"
    status: inferido
    nota: "id inferido pelo padrão f_*. Confirmar. Operador não citou alteração mês a mês."
  emissao:
    selectors:
      - "#f_data_emissao"
    status: ok
    nota: "Confirmado 04/06/2026: input#f_data_emissao. ALTERAR conforme a EMISSÃO do boleto (lida do PDF)."
  vencimento:
    selectors:
      - "#f_vencimento"
    status: ok
    nota: "Confirmado 04/06/2026: input#f_vencimento. ALTERAR conforme o VENCIMENTO do boleto (lido do PDF)."
  prev_pagto:
    selectors:
      - "#f_previsao"
    status: ok
    nota: "Confirmado 04/06/2026: input#f_previsao. Seguir a MESMA data do vencimento."
  # --- Grade de Valor: NÃO é campo único, é uma tabela de itens (linha por valor) ---
  valor_liquido_total:
    selectors:
      - "#f_valorLiquido"
    status: ok
    nota: "Confirmado 04/06/2026: input#f_valorLiquido (total, com addon $). É CALCULADO a partir das linhas da grade — NÃO editar direto. Ler para VALIDAR que o total bate com o valor do PDF."
  valor_grade_input:
    selectors:
      - "#f_valor"
    status: ok
    nota: "Confirmado 04/06/2026: input#f_valor (col-100). Valor da linha; digitar o valor lido do PDF."
  valor_grade_conta:
    selectors:
      - "#f_descricaoConta ~ * .select2-selection--single"
      - ".select2-selection--single"
    status: inferido
    nota: "Conta é um SELECT2 (lista de planos de conta). FIXA por fornecedor (tabela de-para). Abrir/buscar/escolher pelo mesmo padrão do condomínio. >>> Confirmar o id do <select> nativo da Conta para escopo seguro (há vários select2 no modal)."
  valor_grade_complemento:
    selectors:
      - "#f_descricaoConta"
    status: ok
    nota: "Confirmado 04/06/2026: input#f_descricaoConta (col-200, coluna Complemento). Montar como 'DESCRIÇÃO-PADRÃO DO FORNECEDOR REF. MM/AAAA'."
  valor_grade_add:
    selectors:
      - "button.btn-primary.btn-add"
    status: ok
    nota: "Confirmado 04/06/2026: botão AZUL que adiciona a linha de valor após preencher."
  valor_grade_del:
    selectors:
      - "button.btn-danger.btn-del"
    status: ok
    nota: "Confirmado 04/06/2026: botão de LIXEIRA que remove uma linha de valor existente."

