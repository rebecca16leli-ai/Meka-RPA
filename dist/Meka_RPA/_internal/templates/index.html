<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meka RPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
      body { background:    #f5f7fb; }
      .card { border: 0; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
      .dropzone { border: 2px dashed #6c757d; border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; background: white; }
      .dropzone.dragover { border-color: #0d6efd; background: #eef5ff; }
      .hidden { display: none; }
      .progress { height: 10px; }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <div class="card p-4">
        <div class="d-flex p-2 justify-content-between align-items-center">
          <h2>Meka RPA</h2>
          <a href="/gravar" class="btn btn-success d-flex align-items-center gap-2"><i class="bi bi-box-arrow-in-right"></i> Regravar Login</a>
        </div>
        <hr>
        <p class="text-muted">Selecione PDF(s), escolha o condomínio e envie para processamento.</p>

        <div class="row g-3">
          <div class="col-md-12">
            <label class="form-label">Condomínio</label>
            <select id="condominio" class="form-select"></select>
          </div>
        </div>

        <div class="mt-4">
          <div id="dropzone" class="dropzone">
            <input id="arquivoInput" type="file" class="hidden" multiple accept=".pdf" />
            <p class="mb-2 fw-semibold">Arraste os PDFs aqui ou clique para selecionar</p>
            <small class="text-muted">Aguarde o pré-processamento e a IA retornará os dados.</small>
          </div>
        </div>

        <div class="mt-3">
          <ul id="listaArquivos" class="list-group"></ul>
        </div>

        <div class="mt-3 hidden" id="statusBox">
          <div class="d-flex justify-content-between mb-2">
            <strong id="statusTitle">Processando...</strong>
            <span id="statusPercent">0%</span>
          </div>
          <div class="progress">
            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
          </div>
          <div id="statusMessage" class="small text-muted mt-2"></div>
        </div>

        <div class="mt-4">
          <button id="btnEnviar" class="btn btn-primary">Processar</button>
          <button id="btnLimpar" class="btn btn-outline-secondary ms-2">Limpar</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const condominioSelect = document.getElementById('condominio');
      const arquivoInput = document.getElementById('arquivoInput');
      const dropzone = document.getElementById('dropzone');
      const listaArquivos = document.getElementById('listaArquivos');
      const statusBox = document.getElementById('statusBox');
      const statusTitle = document.getElementById('statusTitle');
      const statusPercent = document.getElementById('statusPercent');
      const progressBar = document.getElementById('progressBar');
      const statusMessage = document.getElementById('statusMessage');
      const btnEnviar = document.getElementById('btnEnviar');
      const btnLimpar = document.getElementById('btnLimpar');

      let arquivosSelecionados = [];

      async function carregarCondominios() {
        const response = await fetch('/condominios');
        const data = await response.json();
        condominioSelect.innerHTML = '';
        data.forEach(item => {
          const option = document.createElement('option');
          option.value = item.valor;
          option.textContent = item.nome;
          condominioSelect.appendChild(option);
        });
      }

      function atualizarLista() {
        listaArquivos.innerHTML = '';
        arquivosSelecionados.forEach(file => {
          const item = document.createElement('li');
          item.className = 'list-group-item d-flex justify-content-between align-items-center';
          item.innerHTML = `<span>${file.name}</span><small class="text-muted">${(file.size / 1024).toFixed(1)} KB</small>`;
          listaArquivos.appendChild(item);
        });
      }

      function mostrarStatus(titulo, percent, mensagem) {
        statusBox.classList.remove('hidden');
        statusTitle.textContent = titulo;
        statusPercent.textContent = `${percent}%`;
        progressBar.style.width = `${percent}%`;
        statusMessage.textContent = mensagem;
      }

      async function processarArquivos() {
        if (!arquivosSelecionados.length) {
          return;
        }

        const formData = new FormData();
        formData.append('condominio', condominioSelect.value);
        arquivosSelecionados.forEach(file => formData.append('files', file));

        mostrarStatus('Enviando PDFs...', 10, 'Processando arquivos e iniciando o fluxo do robô.');

        try {
          const response = await fetch('/processar', {
            method: 'POST',
            body: formData
          });
          const data = await response.json();
          
          console.log(data.datas)
          mostrarStatus(data.ok ? 'Concluído' : 'Falha', data.ok ? 100 : 50, data.message || data.detail || 'Processo finalizado.');
        } catch (error) {
          mostrarStatus('Falha', 0, error.message);
        }
      }

      function selecionarArquivos(files) {
        arquivosSelecionados = Array.from(files || []);
        atualizarLista();
        if (arquivosSelecionados.length) {
          processarArquivos();
        }
      }

      dropzone.addEventListener('click', () => arquivoInput.click());
      arquivoInput.addEventListener('change', event => {
        selecionarArquivos(event.target.files);
      });

      ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, event => {
        event.preventDefault();
        dropzone.classList.add('dragover');
      }));
      ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, event => {
        event.preventDefault();
        dropzone.classList.remove('dragover');
      }));
      dropzone.addEventListener('drop', event => {
        selecionarArquivos(event.dataTransfer.files);
      });

      btnLimpar.addEventListener('click', () => {
        arquivosSelecionados = [];
        arquivoInput.value = '';
        atualizarLista();
        statusBox.classList.add('hidden');
      });

      btnEnviar.addEventListener('click', () => {
        processarArquivos();
      });

      carregarCondominios();
    </script>
  </body>
</html>
